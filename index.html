<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divergencia Artística: Cuentagotas y Trazado</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: #eee;
        }

        /* --- ZONA SUPERIOR Y TÍTULOS --- */
        .top-container {
            position: absolute;
            top: 0;
            left: 27%;
            width: 46%;
            height: 65px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }

        .main-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.6rem;
            letter-spacing: 3px;
            color: #e2c068;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.7), 0 2px 4px rgba(0,0,0,0.9);
            font-weight: 700;
            white-space: nowrap;
        }

        .subtitle {
            font-size: 0.65rem;
            color: #aaa;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
            transition: opacity 0.4s ease;
        }

        .subtitle.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #reset-btn {
            position: absolute;
            top: 68px;
            left: 50%;
            transform: translateX(-50%);
            background: #2a2014;
            color: #e2c068;
            border: 1px solid #e2c068;
            padding: 4px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            z-index: 25;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, background 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }

        #reset-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #reset-btn:hover {
            background: #e2c068;
            color: #111;
        }

        /* --- ZONAS LATERALES (CATÁLOGOS DESKTOP) --- */
        .side-panel {
            position: absolute;
            top: 0;
            width: 27%;
            height: 100%;
            padding: 10px;
            padding-top: 65px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0.95;
            transition: opacity 0.5s;
            z-index: 5;
            overflow-y: auto;
        }
        .side-panel::-webkit-scrollbar { width: 4px; }
        .side-panel::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .side-panel:hover { opacity: 1; }

        #left-panel { left: 0; background: linear-gradient(to right, rgba(0,0,0,0.98), rgba(5,5,5,0.9)); }
        #right-panel { right: 0; background: linear-gradient(to left, rgba(0,0,0,0.98), rgba(5,5,5,0.9)); }

        .author-group-card {
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            padding: 6px;
            background: rgba(20, 20, 20, 0.6);
            flex-shrink: 0;
        }

        .author-header-wrapper {
            position: relative;
            margin-bottom: 6px;
        }

        .author-header {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            text-align: center;
            padding: 6px;
            border-radius: 3px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .author-header:hover {
            filter: brightness(1.2);
        }

        .author-alert-tooltip {
            position: relative;
            width: 100%;
            max-height: 0;
            overflow: hidden;
            background: rgba(12, 12, 14, 0.98);
            color: #ddd;
            padding: 0 8px;
            font-size: 0.54rem;
            line-height: 1.4;
            border-radius: 0 0 3px 3px;
            transition: max-height 0.35s ease, padding 0.35s ease, border 0.35s ease;
            border: none;
        }

        .author-header-wrapper.active-bio .author-alert-tooltip {
            max-height: 200px;
            padding: 8px;
            border: 1px solid #e2c068;
            border-top: none;
        }

        .author-header-wrapper.active-bio .author-header {
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            border-bottom: 1px solid #e2c068;
        }

        .author-alert-tooltip::-webkit-scrollbar { width: 3px; }
        .author-alert-tooltip::-webkit-scrollbar-thumb { background: #e2c068; }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            width: 100%;
        }

        .source-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #282828;
            padding: 4px;
            display: flex;
            flex-direction: column;
        }

        .card-square-container {
            position: relative;
            width: 100%;
            padding-bottom: 85%; 
            overflow: hidden;
            background: #000;
            cursor: crosshair;
        }

        .card-square-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-square-container .hover-negative-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s ease;
            object-fit: cover;
        }

        .card-square-container.active-negative .hover-negative-canvas {
            opacity: 1;
        }

        .color-layers-bar {
            display: flex;
            height: 12px;
            width: 100%;
            margin-top: 3px;
            gap: 2px;
            background: #111;
            padding: 2px;
            border: 1px solid #222;
        }

        .color-layer-chip {
            flex: 1;
            height: 100%;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .color-layer-chip:hover {
            transform: scaleY(1.3);
            filter: brightness(1.3);
            border-color: #e2c068;
            z-index: 10;
        }

        .meta-info-container {
            margin-top: 3px;
            padding-top: 2px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .meta-title {
            font-size: 0.58rem;
            color: #e2c068;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta-details {
            font-size: 0.5rem;
            color: #999;
            display: flex;
            justify-content: space-between;
        }

        /* --- ZONA CENTRAL: MARCO --- */
        #center-fusion-zone {
            position: absolute;
            left: 27%;
            width: 46%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .historic-frame {
            position: relative;
            width: 86%;
            height: 82%;
            top: 25px;
            background: #110d0a;
            border: 22px solid #2a2014;
            border-image: linear-gradient(to bottom right, #e2c068 0%, #9c7532 25%, #423012 50%, #b89243 75%, #d1ab53 100%) 22;
            box-shadow: 
                inset 0 0 25px rgba(0, 0, 0, 0.95), 
                inset 0 0 0 6px #1a140d,
                0 30px 70px rgba(0, 0, 0, 0.98);
            overflow: hidden;
        }

        .canvas-interior {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #12100e;
            background-image: radial-gradient(circle at center, #1c1814 0%, #080706 100%);
            overflow: hidden;
        }

        .collage-piece {
            position: absolute;
            width: var(--piece-size);
            height: var(--piece-size);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: scale(0.9) rotate(var(--rot));
            animation: sketchDrawEffect 1.2s cubic-bezier(0.15, 0.9, 0.3, 1) forwards;
        }

        .collage-piece img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @keyframes sketchDrawEffect {
            0% {
                opacity: 0;
                transform: scale(0.8) rotate(var(--rot));
                filter: grayscale(100%) blur(5px) contrast(150%);
            }
            50% {
                opacity: 0.65;
                filter: grayscale(40%) blur(2px) contrast(120%);
            }
            100% {
                opacity: 0.95;
                transform: scale(1) rotate(var(--rot));
                filter: grayscale(0%) blur(0px) contrast(100%);
            }
        }

        .instructions {
            position: absolute;
            bottom: 5px;
            width: 100%;
            text-align: center;
            color: #666;
            font-size: 0.6rem;
            z-index: 10;
            letter-spacing: 1px;
            pointer-events: none;
        }

        .mobile-drag-handle {
            display: none;
        }

        /* ========================================================
           ADAPTACIÓN RESPONSIVE PARA CELULARES Y TABLETS (VERTICAL)
           ======================================================== */
        @media (max-width: 900px) {
            body, html {
                overflow: hidden;
            }

            .top-container {
                left: 0;
                width: 100%;
                height: 45px;
                top: 5px;
            }

            .main-title {
                font-size: 1.1rem;
            }

            #reset-btn {
                top: 48px;
                font-size: 0.5rem;
                padding: 2px 8px;
            }

            #center-fusion-zone {
                left: 0;
                top: 52px;
                width: 100%;
                height: 90vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .historic-frame {
                width: 92%;
                height: 94%;
                top: 0;
                border-width: 12px;
            }

            /* Panel inferior deslizable (Bottom Sheet) */
            .side-panel {
                top: auto;
                bottom: 0;
                transform: translateY(calc(50vh - 35px)); 
                left: 0 !important;
                right: 0 !important;
                width: 100%;
                height: 50vh;
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
                padding: 40px 8px 8px 8px; /* Espacio superior para que la manija absoluta no tape contenido */
                background: rgba(5, 5, 5, 0.98);
                border-top: 2px solid #e2c068;
                gap: 10px;
                align-items: stretch;
                transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
                z-index: 100;
            }

            .side-panel.expanded {
                transform: translateY(0);
            }

            /* Manija absoluta dentro del panel, pegada al tope superior de la sección */
            .mobile-drag-handle {
                display: flex;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 32px;
                background: rgba(20, 20, 22, 0.95);
                justify-content: center;
                align-items: center;
                cursor: pointer;
                z-index: 115;
                border-bottom: 1px solid #333;
            }

            .mobile-drag-handle::after {
                content: '';
                width: 50px;
                height: 5px;
                background: #e2c068;
                border-radius: 3px;
                box-shadow: 0 0 6px rgba(226, 192, 104, 0.8);
            }

            #left-panel {
                display: flex; 
            }

            #right-panel {
                display: none; 
            }

            .side-panel::-webkit-scrollbar {
                height: 6px;
            }
            .side-panel::-webkit-scrollbar-thumb {
                background: #e2c068;
                border-radius: 4px;
            }

            .author-group-card {
                min-width: 180px;
                max-width: 180px;
                height: 100%;
                overflow-y: auto;
                flex-shrink: 0;
                display: flex;
                flex-direction: column;
            }

            .author-group-card::-webkit-scrollbar {
                width: 3px;
            }
            .author-group-card::-webkit-scrollbar-thumb {
                background: #444;
                border-radius: 3px;
            }

            .catalog-grid {
                display: flex;
                flex-direction: column;
                gap: 8px;
                width: 100%;
            }

            .instructions {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="top-container">
        <div class="main-title">Divergencia Artística</div>
        <div class="subtitle" id="main-subtitle">Creá tu obra compuesta</div>
    </div>

    <button id="reset-btn">Comenzar de nuevo</button>

    <div class="side-panel" id="left-panel">
        <div class="mobile-drag-handle" id="drag-handle" title="Deslizar panel"></div>
    </div>
    
    <div id="center-fusion-zone">
        <div class="historic-frame">
            <div class="canvas-interior" id="fusion-canvas"></div>
        </div>
    </div>
    
    <div class="side-panel" id="right-panel"></div>

    <div class="instructions">[ CLIC EN NOMBRE PARA BIO • HOVER EN CHIPS O IMAGEN: NEGATIVO + TRAZO • CLIC PARA TRAZAR ]</div>

    <script>
        const imgDataMap = {
            "xul-palacios": "media/xul-palacios.jpg",
            "xul-contrapunto": "media/xul-contrapunto.jpg",
            "gimenez-2gatos": "media/gimenez-2gatos.jpg",
            "gimenez-nohabra": "media/gimenez-nohabra.jpg",
            "leparc-alquimia338": "media/leparc-alquimia338.jpg",
            "leparc-modulacion48": "media/leparc-modulacion48.jpg",
            "kenneth-paisajecompacto": "media/kenneth-paisajecompacto.jpg",
            "Kenneth-paisajesimaginados": "media/Kenneth-paisajesimaginados.jpg",
            "yente-curvilinea": "media/yente-curvilinea.jpg",
            "yente-impresionismoabstracto": "media/yente-impresionismoabstracto.jpg",
            "aizenberg-sueño": "media/aizenberg-sueno.jpg",
            "aizenberg-padree": "media/aizenberg-padree.jpg"
        };

        const authorsData = [
            {
                name: "Xul Solar",
                colorBg: "#3d1f0f",
                bio: "Xul Solar (1887-1963) pintor, inventor, astrólogo y escritor argentino. Creador de un universo místico, lenguajes inventados y arquitecturas imaginarias.",
                works: [
                    { title: "Palacios en Bría", year: "1932", style: "Acuarela", key: "xul-palacios" },
                    { title: "Contrapunto", year: "1942", style: "Temple", key: "xul-contrapunto" }
                ]
            },
            {
                name: "Edgardo Giménez",
                colorBg: "#4a0f38",
                bio: "Edgardo Giménez (1942) artista, diseñador y escenógrafo argentino, referente clave del arte pop y la vanguardia del Instituto Di Tella con colores vibrantes.",
                works: [
                    { title: "Dos gatos y no habrá ninguno igual", year: "1965", style: "Pop Art", key: "gimenez-2gatos" },
                    { title: "No habrá más penas ni olvido", year: "1972", style: "Arte Pop Camp", key: "gimenez-nohabra" }
                ]
            },
            {
                name: "Julio Le Parc",
                colorBg: "#0f2f3d",
                bio: "Julio Le Parc (1928) referente fundamental del arte cinético y óptico internacional. Sus obras exploran el movimiento, la luz y la participación activa del espectador.",
                works: [
                    { title: "Alquimia 338", year: "1971", style: "Arte Cinético", key: "leparc-alquimia338" },
                    { title: "Modulación", year: "1985", style: "Op Art", key: "leparc-modulacion48" }
                ]
            },
            {
                name: "Kenneth Kemble",
                colorBg: "#2b2b1a",
                bio: "Kenneth Kemble (1923–1998) principal exponente del Informalismo argentino. Pionero absoluto en el uso de collages, ensamblajes y materiales de desecho.",
                works: [
                    { title: "Paisajes imaginados", year: "1974", style: "Abstracción matérica", key: "Kenneth-paisajesimaginados" },
                    { title: "Paisaje compacto", year: "1988", style: "Informalismo", key: "kenneth-paisajecompacto" }
                ]
            },
            {
                name: "Yente (Eugenia Crenovich)",
                colorBg: "#1a2b25",
                bio: "Yente (1905–1990) pintora y ensayista, la primera mujer artista en adherir de manera sostenida al arte abstracto en la Argentina desde finales de los años 30.",
                works: [
                    { title: "Composición curvilínea", year: "1937", style: "Abstracción Geométrica", key: "yente-curvilinea" },
                    { title: "Impresionismo abstracto", year: "1960", style: "Abstracción Libre", key: "yente-impresionismoabstracto" }
                ]
            },
            {
                name: "Roberto Aizenberg",
                colorBg: "#182030",
                bio: "Roberto Aizenberg fue un pintor y escultor surrealista argentino. Fue alumno de Antonio Berni, y tuvo sus comienzos en el surrealismo cuando fue apadrinado por Juan Batlle Planas, alrededor del 1950.",
                works: [
                    { title: "Sueño", year: "1968", style: "Surrealismo", key: "aizenberg-sueño" },
                    { title: "Padre e hijo", year: "1975", style: "Metafísica", key: "aizenberg-padree" }
                ]
            }
        ];

        const fusionCanvas = document.getElementById('fusion-canvas');
        const leftPanel = document.getElementById('left-panel');
        const rightPanel = document.getElementById('right-panel');
        const mainSubtitle = document.getElementById('main-subtitle');
        const resetBtn = document.getElementById('reset-btn');

        let interactionStarted = false;

        function triggerInteractionState() {
            if (!interactionStarted) {
                interactionStarted = true;
                mainSubtitle.classList.add('hidden');
                resetBtn.classList.add('visible');
            }
        }

        function renderCatalogs() {
            // Mantenemos la manija y limpiamos el resto del contenido dinámico del panel izquierdo
            leftPanel.innerHTML = '<div class="mobile-drag-handle" id="drag-handle" title="Deslizar panel"></div>';
            rightPanel.innerHTML = '';

            if (window.innerWidth <= 900) {
                authorsData.forEach(author => buildAuthorGroup(author, leftPanel));
                setupMobileSheetBehavior();
            } else {
                const midpoint = Math.ceil(authorsData.length / 2);
                const leftAuthors = authorsData.slice(0, midpoint);
                const rightAuthors = authorsData.slice(midpoint);

                leftAuthors.forEach(author => buildAuthorGroup(author, leftPanel));
                rightAuthors.forEach(author => buildAuthorGroup(author, rightPanel));
            }
        }

        function setupMobileSheetBehavior() {
            const panel = document.getElementById('left-panel');
            const handle = document.getElementById('drag-handle');

            handle.addEventListener('click', (e) => {
                e.stopPropagation();
                panel.classList.toggle('expanded');
            });
        }

        function buildAuthorGroup(authorObj, container) {
            const groupCard = document.createElement('div');
            groupCard.classList.add('author-group-card');

            const headerWrapper = document.createElement('div');
            headerWrapper.classList.add('author-header-wrapper');

            const header = document.createElement('div');
            header.classList.add('author-header');
            header.style.backgroundColor = authorObj.colorBg;
            header.style.color = '#fff';
            header.textContent = authorObj.name;

            const tooltip = document.createElement('div');
            tooltip.classList.add('author-alert-tooltip');
            tooltip.innerHTML = `<strong>${authorObj.name}</strong><br><br>${authorObj.bio.replace(/\n/g, '<br>')}`;
            
            header.addEventListener('click', () => {
                headerWrapper.classList.toggle('active-bio');
            });

            headerWrapper.appendChild(header);
            headerWrapper.appendChild(tooltip);
            groupCard.appendChild(headerWrapper);

            const grid = document.createElement('div');
            grid.classList.add('catalog-grid');

            authorObj.works.forEach(work => {
                const card = document.createElement('div');
                card.classList.add('source-card');
                
                const imageUrl = imgDataMap[work.key] || "media/xul-palacios.jpg";

                card.innerHTML = `
                    <div class="card-square-container">
                        <img src="${imageUrl}" alt="${work.title}">
                        <canvas class="hover-negative-canvas"></canvas>
                    </div>
                    <div class="color-layers-bar"></div>
                    <div class="meta-info-container">
                        <div class="meta-title">${work.title}</div>
                        <div class="meta-details">
                            <span>${work.year}</span>
                            <span>${work.style}</span>
                        </div>
                    </div>
                `;

                const containerImg = card.querySelector('.card-square-container');
                const hoverNegCanvas = card.querySelector('.hover-negative-canvas');
                const colorBar = card.querySelector('.color-layers-bar');

                const virtualImg = new Image();
                virtualImg.src = imageUrl;
                
                virtualImg.onload = () => {
                    const dominantColors = extractDominantColors(virtualImg, 4);

                    dominantColors.forEach(rgbColor => {
                        const chip = document.createElement('div');
                        chip.classList.add('color-layer-chip');
                        chip.style.backgroundColor = `rgb(${rgbColor.r}, ${rgbColor.g}, ${rgbColor.b})`;
                        chip.title = `Tono rgb(${rgbColor.r}, ${rgbColor.g}, ${rgbColor.b})`;

                        chip.addEventListener('mouseenter', () => {
                            renderColorWithDottedOutline(virtualImg, hoverNegCanvas, rgbColor, 40);
                            containerImg.classList.add('active-negative');
                        });

                        chip.addEventListener('mouseleave', () => {
                            containerImg.classList.remove('active-negative');
                        });

                        chip.addEventListener('click', (e) => {
                            e.stopPropagation();
                            triggerInteractionState();
                            const isolatedLayerUrl = generateColorLayerBlob(virtualImg, rgbColor, 40);
                            addPieceToCanvas(isolatedLayerUrl);
                        });

                        colorBar.appendChild(chip);
                    });
                };

                containerImg.addEventListener('mousemove', (e) => {
                    const rect = containerImg.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = virtualImg.naturalWidth || 300;
                    canvas.height = virtualImg.naturalHeight || 300;
                    ctx.drawImage(virtualImg, 0, 0);

                    const scaleX = canvas.width / rect.width;
                    const scaleY = canvas.height / rect.height;
                    const pixelX = Math.floor(x * scaleX);
                    const pixelY = Math.floor(y * scaleY);

                    try {
                        const pixelData = ctx.getImageData(pixelX, pixelY, 1, 1).data;
                        const hoveredRgb = { r: pixelData[0], g: pixelData[1], b: pixelData[2] };
                        
                        renderColorWithDottedOutline(virtualImg, hoverNegCanvas, hoveredRgb, 35);
                        containerImg.classList.add('active-negative');
                    } catch (err) {}
                });

                containerImg.addEventListener('mouseleave', () => {
                    containerImg.classList.remove('active-negative');
                });

                containerImg.addEventListener('click', (e) => {
                    triggerInteractionState();
                    const rect = containerImg.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = virtualImg.naturalWidth || 300;
                    canvas.height = virtualImg.naturalHeight || 300;
                    ctx.drawImage(virtualImg, 0, 0);

                    const scaleX = canvas.width / rect.width;
                    const scaleY = canvas.height / rect.height;
                    const pixelX = Math.floor(x * scaleX);
                    const pixelY = Math.floor(y * scaleY);

                    try {
                        const pixelData = ctx.getImageData(pixelX, pixelY, 1, 1).data;
                        const clickedRgb = { r: pixelData[0], g: pixelData[1], b: pixelData[2] };
                        const isolatedLayerUrl = generateColorLayerBlob(virtualImg, clickedRgb, 35);
                        addPieceToCanvas(isolatedLayerUrl);
                    } catch (err) {
                        console.error("Error al procesar el píxel.", err);
                    }
                });

                grid.appendChild(card);
            });

            groupCard.appendChild(grid);
            container.appendChild(groupCard);
        }

        function renderColorWithDottedOutline(img, targetCanvas, targetRgb, tolerance) {
            const ctx = targetCanvas.getContext('2d');
            const w = 150;
            const h = 150;
            targetCanvas.width = w;
            targetCanvas.height = h;

            try {
                ctx.drawImage(img, 0, 0, w, h);
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;

                const matchMask = new Uint8Array(w * h);

                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const i = (y * w + x) * 4;
                        const r = data[i];
                        const g = data[i+1];
                        const b = data[i+2];

                        const dist = Math.sqrt(
                            Math.pow(r - targetRgb.r, 2) + 
                            Math.pow(g - targetRgb.g, 2) + 
                            Math.pow(b - targetRgb.b, 2)
                        );

                        if (dist <= tolerance) {
                            matchMask[y * w + x] = 1;
                            data[i] = 255 - r;
                            data[i+1] = 255 - g;
                            data[i+2] = 255 - b;
                        } else {
                            data[i+3] = 0;
                        }
                    }
                }

                for (let y = 1; y < h - 1; y++) {
                    for (let x = 1; x < w - 1; x++) {
                        const idx = y * w + x;
                        if (matchMask[idx] === 1) {
                            const isEdge = (
                                matchMask[idx - 1] === 0 || 
                                matchMask[idx + 1] === 0 || 
                                matchMask[idx - w] === 0 || 
                                matchMask[idx + w] === 0
                            );

                            if (isEdge) {
                                if ((x + y) % 4 === 0) {
                                    const i = idx * 4;
                                    data[i] = 226;   
                                    data[i+1] = 192; 
                                    data[i+2] = 104;
                                    data[i+3] = 255; 
                                }
                            }
                        }
                    }
                }

                ctx.putImageData(imgData, 0, 0);
            } catch(e) {
                console.error("CORS taint en canvas", e);
            }
        }

        function extractDominantColors(img, colorCount) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 40;
            canvas.height = 40;
            
            try {
                ctx.drawImage(img, 0, 0, 40, 40);
                const imgData = ctx.getImageData(0, 0, 40, 40).data;
                const colorMap = {};

                for (let i = 0; i < imgData.length; i += 16) {
                    const r = Math.round(imgData[i] / 32) * 32;
                    const g = Math.round(imgData[i+1] / 32) * 32;
                    const b = Math.round(imgData[i+2] / 32) * 32;
                    
                    const key = `${r},${g},${b}`;
                    colorMap[key] = (colorMap[key] || 0) + 1;
                }

                const sortedColors = Object.keys(colorMap).sort((a, b) => colorMap[b] - colorMap[a]);
                const result = [];
                for (let i = 0; i < Math.min(colorCount, sortedColors.length); i++) {
                    const parts = sortedColors[i].split(',');
                    result.push({ r: parseInt(parts[0]), g: parseInt(parts[1]), b: parseInt(parts[2]) });
                }
                return result;
            } catch(e) {
                return [{r: 200, g: 150, b: 100}, {r: 50, g: 100, b: 150}, {r: 200, g: 50, b: 50}, {r: 100, g: 200, b: 100}];
            }
        }

        function generateColorLayerBlob(img, targetRgb, tolerance) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.naturalWidth || 300;
            canvas.height = img.naturalHeight || 300;
            
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i+1];
                const b = data[i+2];

                const distance = Math.sqrt(
                    Math.pow(r - targetRgb.r, 2) + 
                    Math.pow(g - targetRgb.g, 2) + 
                    Math.pow(b - targetRgb.b, 2)
                );

                if (distance > tolerance) {
                    data[i+3] = 0;
                }
            }

            ctx.putImageData(imgData, 0, 0);
            return canvas.toDataURL('image/png');
        }

        function addPieceToCanvas(imageUrl) {
            const wrapper = document.createElement('div');
            wrapper.classList.add('collage-piece');

            const img = document.createElement('img');
            img.src = imageUrl;
            wrapper.appendChild(img);

            const sizes = [200, 200, 320, 320, 320, 460];
            const randomSize = sizes[Math.floor(Math.random() * sizes.length)];
            wrapper.style.setProperty('--piece-size', `${randomSize}px`);

            const randomX = (Math.random() * 60) - 10; 
            const randomY = (Math.random() * 60) - 10; 
            const rotation = (Math.random() - 0.5) * 30; 

            wrapper.style.left = `${randomX}%`;
            wrapper.style.top = `${randomY}%`;
            wrapper.style.setProperty('--rot', `${rotation}deg`);
            wrapper.style.zIndex = fusionCanvas.children.length + 1;

            fusionCanvas.appendChild(wrapper);
        }

        resetBtn.addEventListener('click', () => {
            fusionCanvas.innerHTML = '';
            interactionStarted = false;
            mainSubtitle.classList.remove('hidden');
            resetBtn.classList.remove('visible');
        });

        window.addEventListener('DOMContentLoaded', () => {
            renderCatalogs();
        });

        window.addEventListener('resize', () => {
            renderCatalogs();
        });
    </script>
