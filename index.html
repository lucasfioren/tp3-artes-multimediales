<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divergencia Artística: Cuentagotas y Trazado</title>
    <!-- Importación de Montserrat y Cinzel Decorative -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

    <!-- BOTÓN DE CAMBIO DE TEMA (SUPERIOR DERECHA) -->
    <button id="theme-toggle-btn">Modo Claro</button>

    <div class="top-container">
        <div class="main-title">Divergencia Artística</div>
        <div class="subtitle" id="main-subtitle">Creá tu obra compuesta</div>
    </div>

    <button id="reset-btn">Comenzar de nuevo</button>
    <button id="download-btn">Guardar Obra</button>

    <div class="side-panel" id="left-panel">
        <div class="mobile-drag-handle" id="drag-handle" title="Deslizar panel"></div>
    </div>
    
    <div id="center-fusion-zone">
        <div class="historic-frame">
            <div class="canvas-interior" id="fusion-canvas"></div>
        </div>
    </div>
    
    <div class="side-panel" id="right-panel"></div>

    <div class="instructions">[ CLIC EN NOMBRE PARA BIO • HOVER EN CHIPS O IMAGEN: NEGATIVO + TRAZO • CLIC PARA TRAZAR ]</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
